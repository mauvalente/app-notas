<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Notas</title>
  <meta name="theme-color" content="#0f766e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif;
           background: #0f766e; color: #fff; text-align: center; }
    img { width: 96px; height: 96px; border-radius: 22px; }
    small { opacity: .75; }
  </style>
</head>
<body>
  <main>
    <img src="icons/icon-192.png" alt="">
    <h1>Notas</h1>
    <p>Em construção.</p>
    <small id="cfg"></small>
  </main>
  <script type="module">
    // Página provisória (Fase 0): confirma que o GitHub Pages está no ar e se o config.js foi preenchido.
    import { CONFIG } from './config.js';
    const faltando = Object.entries(CONFIG).filter(([, v]) => String(v).includes('COLE-AQUI')).map(([k]) => k);
    document.getElementById('cfg').textContent = faltando.length
      ? 'Falta preencher no config.js: ' + faltando.join(', ')
      : 'config.js preenchido ✓';
  </script>
</body>
</html>
